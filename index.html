<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WonBee</title>
    <meta name="description" content="Minimalist High-Performance Workspace &amp; Hybrid Grid with Kanban Board, TipTap Editor, and Command Palette" />
    <meta property="og:title" content="WonBee" />
    <meta property="og:description" content="Minimalist High-Performance Workspace &amp; Hybrid Grid with Kanban Board, TipTap Editor, and Command Palette" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/joungkyun/font-d2coding/d2coding.css" />
    <style>
      /* Fallback system typography for instant 0ms offline rendering */
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      }
      code, pre, kbd {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      }
    </style>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('wonbee_theme');
          var env = localStorage.getItem('wonbee_user_env');
          if (env) {
            var parsed = JSON.parse(env);
            if (parsed && parsed.theme) theme = parsed.theme;
          }
          if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-amber-50/30 text-stone-900 dark:bg-stone-950 dark:text-stone-100 antialiased selection:bg-amber-400/30">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
