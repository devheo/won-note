<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WonBee</title>
    <meta name="description" content="Minimalist High-Performance Workspace &amp; Hybrid Grid with Kanban Board, Offline Calendar with Macros, TipTap Editor, and Command Palette" />
    <meta property="og:title" content="WonBee" />
    <meta property="og:description" content="Minimalist High-Performance Workspace &amp; Hybrid Grid with Kanban Board, Offline Calendar with Macros, TipTap Editor, and Command Palette" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      /* Clean, 100% offline & intranet-safe system typography without external CDN libraries */
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Pretendard", "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", "Nanum Gothic", "나눔고딕", "Noto Sans KR", dotum, sans-serif;
      }
      code, pre, kbd {
        font-family: ui-monospace, SFMono-Regular, "D2Coding", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      }
    </style>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('wonbee_theme');
          var env = localStorage.getItem('wonbee_user_env');
          if (env) {
            var parsed = JSON.parse(env);
            if (parsed && parsed.theme) theme = parsed.theme;
          }
          if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-amber-50/30 text-stone-900 dark:bg-stone-950 dark:text-stone-100 antialiased selection:bg-amber-400/30">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
