name: "Build Windows App"

on:
  push:
    tags:
      - 'v*' # v1.0.0 같은 태그를 생성해서 push하면 자동 실행
  workflow_dispatch: # GitHub 웹 UI에서 버튼을 눌러 수동 실행도 가능

jobs:
  build-windows:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Tauri App for Windows
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__ # tauri.conf.json의 package.version 사용
          releaseName: "WonBee v__VERSION__"
          releaseBody: "Windows 64-bit release build"
          releaseDraft: true
          prerelease: false
          packageManager: npm
          args: --target x86_64-pc-windows-msvc
